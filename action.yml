name: 'Maestro Instrumentation'
description: "Apply Maestro's locked instrumentation config to your JAR build"
author: 'Oteligence'
branding:
  icon: 'activity'
  color: 'blue'

inputs:
  api-key:
    description: 'Maestro API key — use a GitHub Secret, not inline'
    required: true
  project:
    description: 'Maestro project name (e.g. banking-app). Optional if project-id is given.'
    required: false
  project-id:
    description: 'Maestro project UID. Wins over `project` when set — use it if the name may be wrong/forgotten. Provide project OR project-id (or both).'
    required: false
  org-id:
    description: "The id of the organization to act for (org_... on hosted SaaS, a UUID on a private-cloud VM). Needed only when the API key is not scoped to a project and its owner belongs to several organizations."
    required: false
  service:
    description: "The name the environment registers this service under, normally the analysis's name for the JAR: its spring.application.name, else the JAR file name without its version (e.g. fund-transfer-service)"
    required: true
  environment:
    description: 'Target env: dev / staging / prod / <custom>'
    required: true
  jars:
    description: 'Glob path to the service JAR (e.g. target/*.jar). v0 expects exactly one match.'
    required: true
  api-url:
    description: "The Maestro API this run talks to: https://prod.api.oteligence.com for hosted Maestro, your platform's own address for a private-cloud install. Must be https://"
    required: true
  trusted-api-host:
    description: "A private-cloud install's API hostname (e.g. maestro.example.internal), with no scheme, port or path. api-url may then point at that host and no other; leave it unset for hosted Maestro, whose *.oteligence.com hosts need no naming"
    required: false
  timeout-seconds:
    description: 'Max wait for each Maestro job to complete'
    required: false
    default: '300'
  fail-on-warnings:
    description: 'Fail the step if this run made peer services stale (default: false)'
    required: false
    default: 'false'
  skip-generate-on-inactive:
    description: >-
      If the tenant subscription is inactive (402), skip extension-JAR generation and continue the
      pipeline (deploy proceeds WITHOUT a new extension) instead of failing the step. Default false.
    required: false
    default: 'false'
  skip-on-removed-service:
    description: >-
      If this service is no longer part of the env's Maestro config (removed from the project), skip
      gracefully (generated=false) and continue the pipeline instead of failing the step. Default false
      — a removed or mistyped service hard-fails with a clear message.
    required: false
    default: 'false'
  signing-public-key:
    description: >-
      The Ed25519 public key your Maestro platform signs builds with, as PEM or as the base64 of its X.509
      SubjectPublicKeyInfo. When set, the step fails unless the build carries a statement this key signed that names
      this run's lock and every file the build's record covers. Unset, a signed build is reported and not checked. Take
      it from your own records, never from the Maestro server.
    required: false
  require-signed-build:
    description: >-
      'true' fails the step when signing-public-key is empty, so a workflow variable that is missing in a repository or
      environment cannot switch the signature check off. Default 'false'.
    required: false
    default: 'false'

outputs:
  generated:
    description: "'true' when the build bundle was generated; 'false' when generation was skipped (an inactive subscription with skip-generate-on-inactive, or a removed service with skip-on-removed-service)"
  extension-dir:
    description: "Local path to the extracted build bundle: the extension JARs and configs, without the OTel agent JAR; empty when 'generated' is 'false'"
  config-path:
    description: "Local path to this service's javaagent.config from the build; empty, with a warning, when the build has none for it"
  collector-config-path:
    description: 'Local path to the resolved collector config (deploy to your Collector, not the app image)'
  locked-version:
    description: 'The locked version applied (e.g. 22) — use for image labels'
  jar-sha:
    description: 'SHA256 of the uploaded JAR (or cache hit)'
  job-id:
    description: 'Maestro build job ID — for audit / log lookup'
  build-record:
    description: "How the build's files stand against the record of its inputs: 'recorded' (the first build of these inputs) or 'matched' (a rebuild produced the recorded files); empty when 'generated' is 'false'. The action refuses any other outcome."
  build-signature:
    description: "'verified' (signed by signing-public-key), 'not-checked' (signed, but signing-public-key is not set) or 'unsigned' (the platform holds no signing key); empty when 'generated' is 'false'. With signing-public-key set, every outcome but 'verified' fails the step."


runs:
  using: 'node24'
  main: 'dist/index.js'
  # Closes a deploy run the main step left open; a separate bundle that cannot run the pipeline.
  post: 'dist/post/index.js'

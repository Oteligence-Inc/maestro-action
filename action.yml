name: 'Maestro Instrumentation'
description: "Apply Maestro's locked instrumentation config to your JAR build"
author: 'Oteligence'
branding:
  icon: 'activity'
  color: 'blue'

inputs:
  api-key:
    description: 'Maestro API key — use a GitHub Secret, not inline'
    required: true
  project:
    description: 'Maestro project name (e.g. banking-app). Optional if project-id is given.'
    required: false
  project-id:
    description: 'Maestro project UID. Wins over `project` when set — use it if the name may be wrong/forgotten. Provide project OR project-id (or both).'
    required: false
  service:
    description: "The service's name in Maestro: the analysis's name for this JAR (its spring.application.name, else its file name), as the wizard shows it (e.g. fund-transfer-service)"
    required: true
  environment:
    description: 'Target env: dev / staging / prod / <custom>'
    required: true
  jars:
    description: 'Glob path to the service JAR (e.g. target/*.jar). v0 expects exactly one match.'
    required: true
  api-url:
    description: 'Override Maestro API base URL (advanced — for testing). Must be https://'
    required: false
    default: 'https://api.oteligence.com'
  timeout-seconds:
    description: 'Max wait for each Maestro job to complete'
    required: false
    default: '300'
  fail-on-warnings:
    description: 'Fail the step if this run made peer services stale (default: false)'
    required: false
    default: 'false'
  skip-generate-on-inactive:
    description: >-
      If the tenant subscription is inactive (402), skip extension-JAR generation and continue the
      pipeline (deploy proceeds WITHOUT a new extension) instead of failing the step. Default false.
    required: false
    default: 'false'
  skip-on-removed-service:
    description: >-
      If this service is no longer part of the env's Maestro config (removed from the project), skip
      gracefully (generated=false) and continue the pipeline instead of failing the step. Default false
      — a removed or mistyped service hard-fails with a clear message.
    required: false
    default: 'false'

outputs:
  generated:
    description: "'true' when an extension JAR was generated; 'false' when skipped (inactive subscription)"
  extension-dir:
    description: 'Local path to the extracted OTel agent + extension JAR bundle'
  config-path:
    description: "Local path to this service's javaagent.config from the build; empty, with a warning, when the build has none for it"
  collector-config-path:
    description: 'Local path to the resolved collector config (deploy to your Collector, not the app image)'
  locked-version:
    description: 'The locked version applied (e.g. 22) — use for image labels'
  jar-sha:
    description: 'SHA256 of the uploaded JAR (or cache hit)'
  job-id:
    description: 'Maestro build job ID — for audit / log lookup'

runs:
  using: 'node20'
  main: 'dist/index.js'

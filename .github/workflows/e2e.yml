name: E2E

# End-to-end smoke of the Action through the GitHub action contract (action.yml, INPUT_*
# injection, step outputs), the layer a direct `node dist/index.js` run skips.
#
# It runs against hosted dev (develop.api.oteligence.com) as the CicdTest org, whose project
# `maestro-action-e2e` has a `dev` lock made from fixtures/order-service-1.0.0.jar (the kit
# instrumentation testbed's order service). The repo secrets MAESTRO_API_KEY (that org's
# MAESTRO_ACTION_E2E_DEV key) and MAESTRO_API_URL feed it. A new fixture JAR needs a new lock
# from that JAR, or the build carries none of the locked methods.
#
# Locally with nektos/act, from the repo root:
#   act workflow_dispatch -W .github/workflows/e2e.yml -s MAESTRO_API_KEY=<ak_ key> -s MAESTRO_API_URL=https://develop.api.oteligence.com
# `uses: ./` resolves to this repo's action.yml, so act runs the freshly built dist/.

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Maestro project'
        default: 'maestro-action-e2e'
      service:
        description: 'The service name registered in the Maestro environment'
        default: 'order-service'
      environment:
        description: 'Target env'
        default: 'dev'
      jars:
        description: 'Glob/path to one built JAR in the workspace'
        default: 'fixtures/order-service-1.0.0.jar'
      timeout-seconds:
        description: 'Max wait per Maestro job (build can exceed 270s)'
        default: '600'
      fail-on-warnings:
        description: 'Fail if this run made peers stale'
        default: 'false'
  schedule:
    - cron: '0 3 * * *' # nightly smoke against hosted dev

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # The Action is https-only and allow-lists *.oteligence.com; an act run against another host needs this.
      MAESTRO_ALLOW_CUSTOM_API_URL: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # matches action.yml `runs: using: node24`
          cache: npm

      - run: npm ci
      - run: npm run build # ensure `uses: ./` runs the current source, not a stale bundle

      - id: maestro
        uses: ./
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          api-url: ${{ secrets.MAESTRO_API_URL }}
          project: ${{ inputs.project || 'maestro-action-e2e' }}
          service: ${{ inputs.service || 'order-service' }}
          environment: ${{ inputs.environment || 'dev' }}
          jars: ${{ inputs.jars || 'fixtures/order-service-1.0.0.jar' }}
          timeout-seconds: ${{ inputs.timeout-seconds || '600' }}
          fail-on-warnings: ${{ inputs.fail-on-warnings || 'false' }}

      - name: Assert outputs + artifacts
        run: |
          echo "locked-version = ${{ steps.maestro.outputs.locked-version }}"
          echo "jar-sha        = ${{ steps.maestro.outputs.jar-sha }}"
          echo "job-id         = ${{ steps.maestro.outputs.job-id }}"
          test -n "${{ steps.maestro.outputs.locked-version }}" || { echo "::error::no locked-version output"; exit 1; }
          test -d "${{ steps.maestro.outputs.extension-dir }}"  || { echo "::error::extension-dir missing"; exit 1; }
          test -f "${{ steps.maestro.outputs.config-path }}"    || { echo "::error::config-path missing"; exit 1; }
          echo "E2E outputs + artifacts OK."

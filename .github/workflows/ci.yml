name: CI

# Lint/typecheck/test/build on every push + PR. No backend needed — the HTTP layer
# is mocked with nock. Also guards that the committed dist/ bundle matches src/
# (GitHub runs dist/index.js and dist/post/index.js from the tagged ref, so a stale bundle ships stale code).

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24' # matches action.yml `runs: using: node24`
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Bundle dist/
        run: npm run build

      - name: Verify committed dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date — run 'npm run build' and commit dist/ before pushing."
            git --no-pager diff -- dist/
            exit 1
          fi
          echo "dist/ matches source."
